<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Archives</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            margin: 0;
            background: #f6f8fa;
            color: #1f2328;
            line-height: 1.6;
        }
        .page {
            max-width: 880px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }
        header {
            margin-bottom: 28px;
            text-align: center;
        }
        h1 {
            font-size: 1.7rem;
            margin: 0 0 6px;
        }
        .sub {
            color: #656d76;
            font-size: .9rem;
            margin: 0;
        }
        .sub .count {
            color: #0969da;
            font-weight: 600;
        }
        ul.list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            gap: 10px;
        }
        li.item {
            background: #fff;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            padding: 12px 16px;
        }
        li.item:hover {
            border-color: #0969da;
            box-shadow: 0 2px 8px rgba(9, 105, 218, .12);
        }
        a.link {
            color: #0969da;
            text-decoration: none;
            font-weight: 500;
            word-break: break-all;
        }
        a.link:hover {
            text-decoration: underline;
        }
        footer {
            margin-top: 36px;
            font-size: .8rem;
            color: #8c959f;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="page">
        <header>
            <h1>Archives</h1>
            {% assign _files = site.static_files | where: "extname", ".html" | sort: "name" %}
            <p class="sub">共 <span class="count">{{ _files | size }}</span> 个 HTML 页面</p>
        </header>

        <ul class="list">
            {% for _f in _files %}
            {% if _f.name == "index.html" %}{% continue %}{% endif %}
            <li class="item">
                <a class="link" href="{{ _f.relative_path | relative_url }}" target="_blank">{{ _f.name }}</a>
            </li>
            {% endfor %}
        </ul>

        <footer>由 GitHub Pages (Jekyll) 构建时自动生成</footer>
    </div>
</body>

</html>
