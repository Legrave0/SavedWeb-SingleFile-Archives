<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Archives</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            max-width: 720px;
            margin: 0 auto;
            padding: 24px 16px;
            color: #24292f;
            line-height: 1.6;
        }
        h1 {
            font-size: 1.4rem;
            border-bottom: 1px solid #eaeef2;
            padding-bottom: 10px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            padding: 6px 10px;
            border-radius: 6px;
        }
        li:nth-child(odd) {
            background: #f6f8fa;
        }
        a {
            color: #0969da;
            text-decoration: none;
            word-break: break-all;
        }
        a:hover {
            text-decoration: underline;
        }
        .error,
        .empty {
            color: #8250df;
        }
    </style>
</head>

<body>
    <h1>Archives</h1>
    <div id="status">载入中...</div>
    <script>
        (async () => {
            const host = location.hostname;
            const userMatch = host.match(/(.*)\.github\.io/);
            const repoMatch = location.pathname.match(/^\/([^\/]+)(\/.*)?$/);
            const statusEl = document.getElementById("status");

            if (!userMatch || !repoMatch) {
                statusEl.textContent = "只支持在 GitHub Pages 上使用 (用户名.github.io/仓库名)";
                return;
            }

            const user = userMatch[1];
            const repo = repoMatch[1];

            try {
                const response = await fetch(
                    `https://api.github.com/repos/${user}/${repo}/git/trees/HEAD?recursive=1`,
                    { headers: { Accept: "application/vnd.github+json" } }
                );
                if (!response.ok) {
                    const text = await response.text();
                    throw new Error(`API ${response.status}: ${text}`);
                }
                const tree = await response.json();
                const pagesPath = location.pathname.replace(/\/index\.html?$/, "/").replace(/^\/([^\/]+)\/?$/, "");

                const htmlFiles = (tree.tree || [])
                    .filter(f => f.type === "blob" && /\.html?$/i.test(f.path))
                    .map(f => f.path)
                    .sort();

                const list = htmlFiles
                    .filter(f => f.toLowerCase() !== "index.html")
                    .filter(f => !pagesPath || f.startsWith(pagesPath));

                if (list.length === 0) {
                    statusEl.textContent = "没有找到其他 HTML 文件。";
                    statusEl.className = "empty";
                    return;
                }

                statusEl.remove();
                const listEl = document.createElement("ul");
                for (const file of list) {
                    const item = document.createElement("li");
                    const link = document.createElement("a");
                    link.href = file;
                    link.textContent = file.replace(/^index\.html?$/, "(首页)");
                    link.target = "_blank";
                    item.appendChild(link);
                    listEl.appendChild(item);
                }
                document.body.appendChild(listEl);
            } catch (err) {
                statusEl.textContent = "加载失败: " + err.message;
                statusEl.className = "error";
            }
        })();
    </script>
</body>
