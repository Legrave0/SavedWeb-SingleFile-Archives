<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Archives</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            max-width: 720px;
            margin: 0 auto;
            padding: 24px 16px;
            color: #24292f;
            line-height: 1.6;
        }
        h1 {
            font-size: 1.4rem;
            border-bottom: 1px solid #eaeef2;
            padding-bottom: 10px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            padding: 6px 10px;
            border-radius: 6px;
            background: #f6f8fa;
            margin-bottom: 4px;
        }
        a {
            color: #0969da;
            text-decoration: none;
            word-break: break-all;
        }
        a:hover {
            text-decoration: underline;
        }
        .empty {
            color: #8250df;
        }
    </style>
</head>

<body>
    <h1>Archives</h1>
    {% assign _pages = site.html_pages | sort: "url" %}
    <ul>
        {% for _p in _pages %}
        {% if _p.ext == ".html" and _p.url != "/" and _p.url != "/index.html" %}
        <li><a href="{{ _p.url | relative_url }}" target="_blank">{{ _p.url | remove_first: "/" }}</a></li>
        {% endif %}
        {% endfor %}
    </ul>
</body>

</html>
